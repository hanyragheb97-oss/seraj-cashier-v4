<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة مشتريات - سراج كاشير</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#070913">

    <!-- ✅ الربط بملف التصميم المركزي الموحد ✅ -->
    <link rel="stylesheet" href="style.css">

    <!-- تحميل المكتبات في الخلفية لتسريع فتح الصفحة -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript" defer></script>
</head>
<body class="page-purchases" onclick="closeAllMenus(event);">

    <div class="header" id="mainHeader">
        <button type="button" class="header-camera-btn" onclick="startBarcodeScan('productSearch', true)" title="تصوير الباركود">📷</button>
        <span id="pageTitleText">فاتورة مشتريات</span>
        <button type="button" class="header-history-btn" onclick="window.location.href='purchases_history.html'"><span>📋</span> السجل</button>
    </div>

    <!-- زر الإضافة السريعة العائم (+) -->
    <button type="button" class="seraj-btn-add-floating" onclick="openQuickAddModal()" title="إضافة صنف جديد">➕</button>

    <div class="purchases-container">
        <!-- === منطقة البحث والموجة الصوتية === -->
        <div class="search-container">
            <input type="text" id="productSearch" class="seraj-search-input search-input" placeholder="ابحث أو تحدث بالموجة الصوتية..." oninput="smartSearch()" onclick="event.stopPropagation()">
            <button type="button" id="aiAssistantBtn" class="mic-btn-search" onclick="event.stopPropagation(); openAiModal()" title="إضافة سريعة بالصوت">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3zm5 9.5A1.5 1.5 0 0 1 18.5 13a6.5 6.5 0 0 1-13 0A1.5 1.5 0 0 1 7 11.5a1.5 1.5 0 0 1 1.5 1.5 3.5 3.5 0 0 0 7 0 1.5 1.5 0 0 1 1.5-1.5zm-5 8a1.5 1.5 0 0 1 1.5 1.5V23a1.5 1.5 0 0 1-3 0v-2A1.5 1.5 0 0 1 12 19.5z"/>
                </svg>
            </button>
            
            <!-- القائمة المنسدلة داخل حاوية البحث لتنزل ستارة فوق الجدول -->
            <div id="productResults" class="dropdown-list"></div>
        </div>

        <!-- === طابور الإضافة المخفي === -->
        <div id="queueContainer" class="queue-container" onclick="event.stopPropagation()">
            <div>
                <small>طابور المشتريات:</small><br>
                <span id="queueStatusText" class="queue-text">--</span>
            </div>
            <div>
                <button type="button" class="queue-btn-next" onclick="processNextInQueue()">تخطي / التالي ⏭️</button>
            </div>
        </div>

        <!-- === جدول الفاتورة الموحد === -->
        <div class="seraj-table-wrapper table-wrapper">
            <table class="seraj-table">
                <thead>
                    <tr><th>الصنف</th><th>الشراء</th><th>العدد</th><th>الإجمالي</th></tr>
                </thead>
                <tbody id="invoiceItems"></tbody>
            </table>
        </div>
    </div>

    <!-- === الشريط السفلي === -->
    <div class="bottom-dashboard" id="bottomActionBar" onclick="event.stopPropagation()">
        <div class="dashboard-right">
            <button type="button" class="bottom-back-btn" onclick="goBackSmart()">
                <span class="arrow">⬅</span>
                <span class="text">BACK</span>
            </button>
            <button type="button" id="mainSaveBtn" class="seraj-btn-save save-btn" onclick="if(window.Utils && window.Utils.preventDoubleClick) { window.Utils.preventDoubleClick(this, () => openSaveModal()); } else { openSaveModal(); }">حفظ الفاتورة</button>
        </div>
        <div class="dashboard-left">
            <div id="totalDisplayDiv" class="floating-total">
                <span class="total-label">الإجمالي</span>
                <span class="total-val" id="mainTotal">0.00</span>
            </div>
        </div>
    </div>

    <!-- === الطباعة والتصدير === -->
    <div class="bottom-print-bar" id="bottomPrintBar" onclick="event.stopPropagation()">
        <div>
            <button type="button" class="bottom-print-btn" onclick="togglePrintMenu(event)">🖨️ طباعة / تصدير ▼</button>
            <div class="print-dropdown-menu" id="printDropdownMenu">
                <div class="print-dropdown-item" onclick="printLastInvoice()">🖨️ طباعة حرارية (80mm)</div>
                <div class="print-dropdown-item" onclick="exportLastInvoiceToPDF()">📄 تصدير PDF</div>
                <div class="print-dropdown-item" onclick="exportLastInvoiceToExcel()">📊 تصدير Excel</div>
            </div>
        </div>
    </div>

    <!-- منطقة الطباعة الحرارية المخفية -->
    <div id="printReceiptArea" hidden></div>

    <!-- === النوافذ المنبثقة الموحدة === -->

    <!-- نافذة المايك المنبثقة -->
    <div class="seraj-modal-overlay modal-overlay" id="aiModalOverlay" onclick="closeAiModal()">
        <div class="seraj-modal compact-modal" onclick="event.stopPropagation()">
            <div class="compact-header">
                <h3>استماع المشتريات الذكي</h3>
                <span class="stock-badge">أوفلاين ⚡</span>
            </div>
            <div class="seraj-form-row compact-row">
                <textarea id="aiInputText" placeholder="مثال: هاتلي 3 لمبة 9 وات و 2 شريط لحام..." rows="4"></textarea>
            </div>
            
            <div class="seraj-form-row compact-row">
                <button type="button" onclick="startAiMic()" id="aiMicBtn" class="seraj-btn-save">
                    🎤 اضغط هنا للبدء
                </button>
            </div>
            
            <div id="aiLoadingIndicator" class="queue-text" hidden>جاري دمج الأصناف للطابور... ⏳</div>
            
            <div class="compact-btns">
                <button type="button" class="seraj-btn-cancel btn-close-ai" onclick="closeAiModal()">إلغاء</button>
                <button type="button" id="sendAiBtn" class="seraj-btn-save btn-save-ai" onclick="if(window.Utils && window.Utils.preventDoubleClick) { window.Utils.preventDoubleClick(this, () => processLocalAI()); } else { processLocalAI(); }">إدراج في الطابور 🚀</button>
            </div>
        </div>
    </div>

    <!-- 1. نافذة التعديل مع تفاصيل الباتشات -->
    <div class="seraj-modal-overlay modal-overlay" id="editModalOverlay" onclick="closeModals()">
        <div class="seraj-modal compact-modal" onclick="event.stopPropagation()">
            <div class="compact-header"><h3 id="editItemName">تعديل الصنف</h3></div>

            <button type="button" class="details-toggle-btn" onclick="toggleDetails()">+ عرض تفاصيل المخزن (للمقارنة)</button>
            <div class="hidden-details" id="hiddenDetailsBox">
                <div class="batches-slider" id="editBatchesSlider"></div>
                <div>
                    إجمالي الرصيد بالمخزن: <span id="editTotalStock">0</span>
                </div>
            </div>

            <div class="seraj-form-row compact-row">
                <label>صورة المنتج:</label>
                <div>
                    <input type="file" id="editProdImageInput" accept="image/*" hidden onchange="previewSelectedImage('editProdImagePreview', this)">
                    <button type="button" class="details-toggle-btn" onclick="document.getElementById('editProdImageInput').click()">📸 تعديل الصورة</button>
                    <img id="editProdImagePreview" src="" alt="صورة الصنف" width="42" height="42" hidden onclick="showFullImage(event, document.getElementById('editItemIndex').value.replace('new_', ''))">
                </div>
            </div>

            <div class="seraj-form-row compact-row"><label>سعر الشراء (للقطعة):</label><input type="number" id="editPrice" onclick="this.select()"></div>
            <div class="seraj-form-row compact-row"><label>سعر البيع للجمهور:</label><input type="number" id="editSellPrice" onclick="this.select()"></div>
            <div class="seraj-form-row compact-row"><label>الكمية المشتراة:</label><input type="number" id="editQty" onclick="this.select()"></div>
            <input type="hidden" id="editItemIndex">

            <div class="compact-btns">
                <button type="button" class="seraj-btn-cancel btn-close-ai" onclick="closeModals()">إغلاق</button>
                <button type="button" id="confirmItemEditBtn" class="seraj-btn-save btn-save-ai" onclick="if(window.Utils && window.Utils.preventDoubleClick) { window.Utils.preventDoubleClick(this, () => saveItemEdit()); } else { saveItemEdit(); }">تأكيد وإدراج</button>
            </div>
        </div>
    </div>

    <!-- 2. نافذة حفظ الفاتورة (حسابات المورد) -->
    <div class="seraj-modal-overlay modal-overlay" id="saveModalOverlay" onclick="closeModals()">
        <div class="seraj-modal compact-modal" onclick="event.stopPropagation()">
            
            <!-- 1. خصم من المورد -->
            <div class="seraj-form-row compact-row">
                <label class="color-red-val">خصم من المورد</label>
                <input type="number" id="modalDiscount" value="0" onclick="this.select()" oninput="calculateModalTotals()">
            </div>

            <!-- 2. الصافي المطلوب -->
            <div class="seraj-form-row compact-row">
                <label>الصافي المطلوب</label>
                <input type="number" id="modalTotal" class="color-red-val" value="0" readonly>
            </div>
            
            <!-- 3. المبلغ المدفوع -->
            <div class="seraj-form-row compact-row">
                <label class="color-green-val">المبلغ المدفوع</label>
                <input type="number" id="modalPaid" class="color-green-val" value="0" onclick="this.select()" oninput="calculateModalTotals()">
            </div>
            
            <!-- 4. المتبقي (آجل) -->
            <div class="seraj-form-row compact-row">
                <label>المتبقي (آجل)</label>
                <input type="number" id="modalRemaining" value="0" readonly dir="ltr">
            </div>

            <!-- 5. الخزينة والملاحظات -->
            <div class="seraj-form-row compact-row">
                <select id="modalVaultSelect">
                    <option value="main">الخزينة الرئيسية</option>
                    <option value="insta">إنستا (InstaPay)</option>
                    <option value="wallet">محفظة إلكترونية</option>
                </select>
                <input type="text" id="modalNotes" placeholder="ملاحظات الفاتورة...">
            </div>

            <!-- 6. التاريخ -->
            <div class="seraj-form-row compact-row">
                <label>التاريخ:</label>
                <input type="date" id="modalDate">
            </div>

            <!-- 7. اسم المورد -->
            <div class="seraj-form-row compact-row">
                <label>اسم المورد</label>
                <div class="search-container">
                    <input type="hidden" id="selectedSupplierId" value="">
                    <input type="text" id="supplierSearch" class="seraj-search-input search-input" placeholder="اسم المورد..." oninput="handleSupplierInput()">
                    <div id="supplierResults" class="dropdown-list"></div>
                </div>
            </div>
            
            <!-- 8. الرصيد -->
            <div id="liveSupplierBalance"></div>

            <!-- 9. أزرار الحفظ والإغلاق -->
            <div class="compact-btns">
                <button type="button" class="seraj-btn-cancel btn-close-ai" onclick="closeModals()">رجوع</button>
                <button type="button" id="confirmSaveBtn" class="seraj-btn-save btn-save-ai" onclick="if(window.Utils && window.Utils.preventDoubleClick) { window.Utils.preventDoubleClick(this, () => SerajConfirmSave()); } else { SerajConfirmSave(); }">✔ تأكيد الشراء</button>
            </div>
            
        </div>
    </div>

    <!-- 3. نافذة الإضافة السريعة (+) لمنتج جديد تماماً -->

        <div class="seraj-modal compact-modal" onclick="event.stopPropagation()">
            <div class="compact-header"><h3 class="color-green-val">إضافة منتج جديد</h3></div>

            <div class="seraj-form-row compact-row"><label>اسم المنتج:</label><input type="text" id="newProdName"></div>
            <div class="seraj-form-row compact-row"><label>الصنف:</label><input type="text" id="newProdCategory" value="عام"></div>

            <div class="seraj-form-row compact-row">
                <label>الباركود / الكود:</label>
                <div class="search-container">
                    <input type="text" id="newProdBarcode" class="seraj-search-input search-input" placeholder="الكود الجديد">
                    <button type="button" class="header-camera-btn" onclick="startBarcodeScan('newProdBarcode', false)" title="تصوير الباركود">📷</button>
                </div>
            </div>

            <div class="seraj-form-row compact-row">
                <label>صورة المنتج:</label>
                <div>
                    <input type="file" id="newProdImageInput" accept="image/*" hidden onchange="previewSelectedImage('newProdImagePreview', this)">
                    <button type="button" class="details-toggle-btn" onclick="document.getElementById('newProdImageInput').click()">📸 اختر صورة</button>
                    <img id="newProdImagePreview" src="" alt="صورة المنتج الجديد" width="42" height="42" hidden>
                </div>
            </div>

            <div class="seraj-form-row compact-row"><label>سعر الشراء:</label><input type="number" id="newProdPurchase" value="0" onclick="this.select()"></div>
            <div class="seraj-form-row compact-row"><label>سعر البيع:</label><input type="number" id="newProdPrice" value="0" onclick="this.select()"></div>

            <div class="compact-btns">
                <button type="button" class="seraj-btn-cancel btn-close-ai" onclick="closeModals()">إلغاء</button>
                <button type="button" id="saveQuickProdBtn" class="seraj-btn-save btn-save-ai" onclick="if(window.Utils && window.Utils.preventDoubleClick) { window.Utils.preventDoubleClick(this, () => saveNewProductQuick()); } else { saveNewProductQuick(); }">حفظ المنتج</button>
            </div>
        </div>
    </div>

    <!-- 4. قارئ الباركود -->
    <div class="seraj-modal-overlay modal-overlay" id="scannerModal">
        <div class="seraj-modal compact-modal">
            <div class="compact-header"><h3>📷 توجيه الكاميرا للباركود</h3></div>
            <div id="reader"></div>
            <div class="compact-btns">
                <button type="button" class="seraj-btn-cancel btn-close-ai" onclick="stopBarcodeScan()">إغلاق الكاميرا</button>
            </div>
        </div>
    </div>

    <!-- 5. نافذة تكبير الصورة -->
    <div class="seraj-modal-overlay modal-overlay" id="fullImageModal" onclick="closeModals()">
        <div class="seraj-modal compact-modal" onclick="event.stopPropagation()">
            <div class="compact-header">
                <h3>معاينة الصورة</h3>
                <button type="button" class="seraj-btn-cancel btn-close-ai" onclick="closeModals()">✖</button>
            </div>
            <img id="fullImageDisplay" src="" alt="معاينة الصورة بالحجم الكامل">
        </div>
    </div>

    <script src="db.js"></script>

    <script>
        function applyFallbackTheme() {
            if (typeof DB !== 'undefined' && DB.applySavedTheme) {
                DB.applySavedTheme();
            }
        }

        let productsDB = [];
        let suppliersDB = [];
        let purchaseInvoicesDB = [];
        
        function loadDB() {
            try {
                if (typeof DB !== 'undefined') {
                    productsDB = DB.getProducts(true) || [];
                    suppliersDB = (typeof DB.calculateSupplierBalances === 'function' ? DB.calculateSupplierBalances() : DB.getSuppliers()) || [];
                    if (!Array.isArray(suppliersDB) || suppliersDB.length === 0) {
                        suppliersDB = DB.getSuppliers() || [];
                    }
                    purchaseInvoicesDB = DB.getPurchaseInvoices() || [];
                } else {
                    productsDB = JSON.parse(localStorage.getItem('seraj_products')) || [];
                    suppliersDB = JSON.parse(localStorage.getItem('seraj_suppliers')) || [];
                    purchaseInvoicesDB = JSON.parse(localStorage.getItem('seraj_purchase_invoices')) || [];
                }
            } catch(e) { console.error(e); }
        }

        let invoice = JSON.parse(localStorage.getItem('seraj_draft_purchase')) || [];
        let lastSavedInvoice = null; 

        function saveDraft() { localStorage.setItem('seraj_draft_purchase', JSON.stringify(invoice)); }

        window.onload = () => {
            if (typeof applyFallbackTheme === 'function') applyFallbackTheme();
            if (typeof loadDB === 'function') loadDB();
            if (typeof renderTable === 'function') renderTable();

            // مستمع التحديثات اللحظية للمزامنة المركزية (V4 Clean)
            window.addEventListener('seraj:updated', (e) => {
                if (typeof loadDB === 'function') loadDB();
                if (typeof renderTable === 'function') renderTable();
            });
        };

        function handleExit() { window.location.href = 'index.html'; }
        function goBackSmart() {
            if (typeof handleExit === 'function') handleExit();
            else window.location.href = 'index.html';
        }

        function searchProducts() {
            loadDB(); 
            const rawQuery = document.getElementById('productSearch').value.trim().toLowerCase();
            const searchWords = rawQuery.split(' ').filter(word => word.length > 0);
            const resultsDiv = document.getElementById('productResults');
            resultsDiv.innerHTML = ''; 
            
            resultsDiv.scrollTop = 0; 
            
            if(searchWords.length === 0) { resultsDiv.style.display = 'none'; return; }

            if (!productsDB || !Array.isArray(productsDB)) productsDB = [];

            let filtered = productsDB.map(p => {
                let pName = String(p.name || '').toLowerCase();
                let score = 0;
                searchWords.forEach(w => { 
                    if (pName.includes(w) || String(p.barcode || '').includes(w)) score += 1; 
                });
                if (score > 0 && pName.startsWith(searchWords[0])) score += 2; 
                return { product: p, score: score };
            }).filter(item => item.score > 0);

            filtered.sort((a, b) => b.score - a.score);

            if(filtered.length > 0) {
                resultsDiv.style.display = 'block';
                filtered.forEach(item => {
                    let p = item.product;
                    let totalStock = (p.lots && p.lots.length > 0) ? p.lots.reduce((sum, l) => sum + (parseFloat(l.stock) || 0), 0) : (parseFloat(p.stock) || 0);
                    let dispPurchasePrice = (p.lots && p.lots.length > 0) ? p.lots[p.lots.length - 1].purchasePrice : (parseFloat(p.purchasePrice) || 0);
                    
                    let isItemArchived = (p.isDeleted || p.isArchived);
                    let isDeletedText = isItemArchived ? `<span class="color-red-val" style="font-size:13px; font-weight:bold; margin-right:5px;">(مؤرشف)</span>` : '';
                    let imgHtml = p.hasImage ? `<img id="search_img_${p.id}" src="" alt="" width="35" height="35">` : '';

                    const div = document.createElement('div'); 
                    div.className = isItemArchived ? 'dropdown-item archived-item' : 'dropdown-item';
                    // استخدام <span> كما طلب مدير النظام لضبط المحاذاة المركزية
                    div.innerHTML = `
                        <span style="display:flex; align-items:center; gap:5px;">${imgHtml} <strong>${p.name}</strong> ${isDeletedText}</span>
                        <span class="color-red-val" style="font-weight:bold;">${dispPurchasePrice}</span>
                        <span class="stock-badge">رصيد: ${totalStock}</span>
                    `;
                    
                    div.onmousedown = async (e) => {
                        e.preventDefault(); 
                        
                        let existsIndex = invoice.findIndex(invItem => String(invItem.id) === String(p.id));
                        if(existsIndex > -1) {
                            SerajAlert("الصنف موجود مسبقاً في الفاتورة!");
                            document.getElementById('productSearch').value = ''; 
                            resultsDiv.style.display = 'none';
                            return; 
                        }

                        if (p.isDeleted) {
                            if(await SerajConfirm("هذا الصنف محذوف. هل تريد إعادة تنشيطه وإضافته للفاتورة الحالية؟ سيتم تصفير رصيده القديم لتبدأ من جديد.")) {
                                p.isDeleted = false;
                                p.isArchived = false;
                                p.stock = 0; 
                                p.lots = []; 
                                p._lastModified = Date.now();
                                p._lastModifiedBy = localStorage.getItem('seraj_device_name') || 'غير معروف';
                                if(typeof DB !== 'undefined') DB.saveProducts(productsDB); 
                                openEditModalForNewItem(p.id); 
                            }
                        } else {
                            openEditModalForNewItem(p.id); 
                        }
                    };
                    resultsDiv.appendChild(div);
                    if (p.hasImage) loadImageFromDB(p.id, `search_img_${p.id}`);
                });
            } else {
                resultsDiv.style.display = 'none';
            }
        }

        let searchTimer;
        function smartSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                searchProducts();
            }, 150); 
        }

        function openEditModalForNewItem(productId) {
            history.pushState({ modalOpen: true }, ''); 

            document.getElementById('productSearch').value = ''; 
            document.getElementById('productResults').style.display = 'none';
            
            loadDB(); 
            let p = productsDB.find(x => String(x.id) === String(productId));
            if(!p) return;

            let dispPPrice = (p.lots && p.lots.length > 0) ? p.lots[p.lots.length - 1].purchasePrice : (p.purchasePrice || 0);
            let dispSell = (p.lots && p.lots.length > 0) ? p.lots[p.lots.length - 1].price : (p.price || 0);
            
            document.getElementById('editItemName').innerText = p.name;
            document.getElementById('editPrice').value = dispPPrice;
            document.getElementById('editSellPrice').value = dispSell;
            document.getElementById('editQty').value = (typeof currentQueueQty !== 'undefined') ? currentQueueQty : 1; 
            document.getElementById('editItemIndex').value = 'new_' + p.id; 

            document.getElementById('editProdImageInput').value = '';
            let preview = document.getElementById('editProdImagePreview');
            if (p.hasImage) {
                loadImageFromDB(p.id, 'editProdImagePreview');
                preview.hidden = false;
                preview.style.display = 'block';
            } else {
                preview.hidden = true;
                preview.style.display = 'none';
                preview.src = '';
            }

            let slider = document.getElementById('editBatchesSlider');
            slider.innerHTML = ''; 
            let totalStock = 0;

            if (p.lots && p.lots.length > 0) {
                p.lots.forEach(b => {
                    let bStock = parseFloat(b.stock) || 0;
                    totalStock += bStock;
                    slider.innerHTML += `
                        <div class="batch-card">
                            <div><strong>مورد: ${b.supplier || 'نقدي'}</strong></div>
                            <div>شراء: <span class="color-red-val">${b.purchasePrice}</span> ج</div>
                            <div>بيع: <span class="color-green-val">${b.price}</span> ج</div>
                            <div>كمية: <span class="color-green-val">${bStock}</span></div>
                        </div>
                    `;
                });
            } else { 
                totalStock = parseFloat(p.stock) || 0;
                slider.innerHTML = `
                    <div class="batch-card">
                        <div>شراء سابق: <span class="color-red-val">${p.purchasePrice || 0}</span> ج</div>

        function saveItemEdit() {

            let newQty = parseFloat(document.getElementById('editQty').value) || 1;

            if (newPPrice > newSPrice) {
                SerajAlert(`❌ تنبيه: سعر الشراء (${newPPrice}) أعلى من سعر البيع (${newSPrice})! يرجى المراجعة.`);

            if (indexVal.startsWith('new_')) {
                let prodId = indexVal.replace('new_', ''); 
                prodIdToSaveImg = prodId;
                let p = productsDB.find(x => String(x.id) === prodId);
                
                if (p) {
                    const existingIndex = invoice.findIndex(item => String(item.id) === String(p.id));
                    if (existingIndex > -1) {
                        invoice[existingIndex].qty += newQty; 
                        invoice[existingIndex].purchasePrice = newPPrice;
                        invoice[existingIndex].sellPrice = newSPrice;
                        invoice[existingIndex].total = newPPrice * invoice[existingIndex].qty;
                    } else {
                        invoice.unshift({ 
                            ...p,

                            sellPrice: newSPrice, 
                            qty: newQty,
                            total: newPPrice * newQty,
                            hasImage: p.hasImage
                        });
                    }
                } else {
                    SerajAlert("حدث خطأ: لم يتم العثور على بيانات هذا الصنف.");
                    return;
                }
            } else {
                let idx = parseInt(indexVal);
                if (!isNaN(idx) && invoice[idx]) {
                    prodIdToSaveImg = invoice[idx].id;

        function renderTable() {
            const tbody = document.getElementById('invoiceItems');
            tbody.innerHTML = ''; let subTotal = 0;
            
            invoice.forEach((item, index) => {
                let itemPrice = parseFloat(item.purchasePrice) || 0;
                let itemQty = parseFloat(item.qty) || 0;
                let itemTot = itemPrice * itemQty;
                subTotal += itemTot;

                const tr = document.createElement('tr');
                tr.className = 'swipe-row';
                
                let startX = 0; let currentX = 0; let isDragging = false; let pressTimer = null;
                let lastClickTime = 0;
                let isLongPress = false;

                const onStart = (clientX) => {
                    startX = clientX; currentX = startX; isDragging = true; isLongPress = false;
                    pressTimer = setTimeout(() => {
                        if (isDragging && Math.abs(currentX - startX) < 10) { 
                            isDragging = false; isLongPress = true; openEditModal(index); 
                        }
                    }, 600);
                };

                const onMove = (clientX) => {
                    if (!isDragging) return;
                    currentX = clientX; let diff = currentX - startX;
                    if (Math.abs(diff) > 15) {
                        clearTimeout(pressTimer); tr.style.transform = `translateX(${diff}px)`; tr.style.opacity = `${1 - Math.abs(diff) / 300}`;
                    }
                };

                const onEnd = () => {
                    if (!isDragging) return;
                    isDragging = false; clearTimeout(pressTimer); let diff = currentX - startX;
                    if (Math.abs(diff) > 90) {
                        tr.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
                        tr.style.transform = `translateX(${diff > 0 ? 100 : -100}%)`; tr.style.opacity = '0';
                        setTimeout(() => { invoice.splice(index, 1); saveDraft(); renderTable(); }, 250);
                    } else {
                        tr.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
                        tr.style.transform = 'translateX(0)'; tr.style.opacity = '1';
                    }
                };

                tr.onmousedown = (e) => { onStart(e.clientX); }; tr.onmousemove = (e) => { onMove(e.clientX); };
                tr.onmouseup = (e) => { onEnd(); }; tr.onmouseleave = (e) => { if(isDragging) onEnd(); };
                tr.ontouchstart = (e) => { onStart(e.touches[0].clientX); }; tr.ontouchmove = (e) => { onMove(e.touches[0].clientX); }; tr.ontouchend = (e) => { onEnd(); };

                tr.onclick = (e) => {
                    let now = Date.now();
                    if (now - lastClickTime < 400) { e.preventDefault(); return; }
                    lastClickTime = now;

                    if (Math.abs(currentX - startX) < 10 && !isLongPress) {
                        invoice[index].qty += 1;
                        invoice[index].total = (parseFloat(invoice[index].purchasePrice) || 0) * invoice[index].qty;
                        
                        saveDraft(); 
                        renderTable();
                    }
                };

                let imgHtml = item.hasImage ? `<span onclick="showFullImage(event, '${item.id}')"><img id="inv_img_${item.id}" src="" alt="" width="30" height="30"></span>` : '';

                tr.innerHTML = `
                    <td>
                        <div>
                            ${imgHtml}
                            <strong>${item.name}</strong>
                        </div>
                    </td>
                    <td>${itemPrice.toFixed(2)}</td>
                    <td>${itemQty}</td>
                    <td class="color-red-val">${itemTot.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);

                if (item.hasImage) loadImageFromDB(item.id, `inv_img_${item.id}`);
            });
            
            document.getElementById('mainTotal').innerText = subTotal.toFixed(2);

            let totalDiv = document.getElementById('totalDisplayDiv');
            let saveBtn = document.getElementById('mainSaveBtn');
            if(invoice.length === 0) {
                totalDiv.style.display = 'none'; saveBtn.style.display = 'none';
            } else {
                totalDiv.style.display = 'flex'; saveBtn.style.display = 'flex';
            }
        }

            let discount = parseFloat(document.getElementById('modalDiscount').value) || 0;
            let finalReq = grossTotal - discount;
            if (finalReq < 0) finalReq = 0; 
            document.getElementById('modalTotal').value = finalReq.toFixed(2);
            let paid = parseFloat(document.getElementById('modalPaid').value) || 0;
            document.getElementById('modalRemaining').value = (finalReq - paid).toFixed(2);
        }

        function generateSmartPurchaseId(dbArray) {
            let deviceCode = localStorage.getItem('seraj_device_code');
            if (!deviceCode) {
                deviceCode = Math.floor(Math.random() * 9) + 1; 
                localStorage.setItem('seraj_device_code', deviceCode);
            }

            let myInvoices = dbArray.filter(inv => {
                let strId = String(inv.id);
                return strId.startsWith(deviceCode.toString()) && strId.length >= 6;
            });

            let nextNumber = 1;
            if (myInvoices.length > 0) {
                let maxNum = 0;
                myInvoices.forEach(inv => {
                    let numPart = parseInt(String(inv.id).substring(1));
                    if (!isNaN(numPart) && numPart > maxNum) maxNum = numPart;
                });
                nextNumber = maxNum + 1;
            }

            let finalId = parseInt(deviceCode.toString() + nextNumber.toString().padStart(5, '0'));
            return finalId;
        }

        let _isConfirmingPurchaseSave = false;

        function SerajConfirmSave() {
            // 1. منع التكرار الفوري أو حفظ فاتورة فارغة
            if (_isConfirmingPurchaseSave) return;
            if (!invoice || invoice.length === 0) {
                closeModals();
                return;
            }

            let finalReq = parseFloat(document.getElementById('modalTotal')?.value) || 0;
            let inputPaid = parseFloat(document.getElementById('modalPaid')?.value) || 0;
            let discount = parseFloat(document.getElementById('modalDiscount')?.value) || 0;
            let notes = document.getElementById('modalNotes') ? document.getElementById('modalNotes').value.trim() : "";
            
            let suppInputEl = document.getElementById('supplierSearch');
            let suppIdEl = document.getElementById('selectedSupplierId');
            let suppName = suppInputEl ? suppInputEl.value.trim() : "";
            let suppId = suppIdEl ? suppIdEl.value : "";
            let vaultKey = document.getElementById('modalVaultSelect')?.value || 'main';
            let invDate = document.getElementById('modalDate')?.value || new Date().toISOString().split('T')[0];

            if (suppName === "null" || suppName === "مورد نقدي" || suppName === "بدون مورد") suppName = "";
            let remaining = parseFloat((finalReq - inputPaid).toFixed(2));

            if (remaining > 0 && suppName === "") {
                return SerajAlert("❌ الفاتورة بها آجل! يجب إدخال اسم المورد.", "error");
            }

            _isConfirmingPurchaseSave = true;

            // أخذ نسخة من أصناف الفاتورة قبل تنظيف الشاشة الفوري
            let formattedItems = invoice.map(item => ({
                id: item.id,
                name: item.name,
                purchasePrice: parseFloat(item.purchasePrice) || 0,
                price: parseFloat(item.sellPrice || item.price) || 0,
                qty: parseFloat(item.qty) || 0,
                total: parseFloat(((parseFloat(item.purchasePrice) || 0) * (parseFloat(item.qty) || 0)).toFixed(2))
            }));

            let newInvoiceId = typeof generateSmartPurchaseId === 'function' ? generateSmartPurchaseId(purchaseInvoicesDB) : window.Utils.generateInvoiceId();
            let dName = localStorage.getItem('seraj_device_name') || 'غير معروف';

            // ⚡ 2. إغلاق النافذة وتفريغ الجدول فوراً قبل الحفظ الثقيل ⚡
            localStorage.removeItem('seraj_draft_purchase'); 
            localStorage.removeItem('seraj_draft_supplier');
            if (suppInputEl) suppInputEl.value = "";
            if (suppIdEl) suppIdEl.value = "";
            invoice = [];
            renderTable(); 
            closeModals();

            let printBar = document.getElementById('bottomPrintBar');
            if (printBar) {
                printBar.style.display = 'flex';
                setTimeout(() => { printBar.style.display = 'none'; }, 8000);
            }

            // 🔄 3. تنفيذ حفظ الموردين والمخزن والخزينة والفاتورة في الخلفية (V4 Clean) 🔄
            setTimeout(() => {
                try {
                    loadDB();
                    let nowTs = Date.now();
                    let prevBal = 0, currBal = 0;

                    // القاعدة 3: البحث عن اسم المورد بـ normalizeName وعدم تعديل السندات أو الأرصدة يدوياً
                    if (suppName !== "") {
                        let normalizedSuppName = (window.Utils && typeof window.Utils.normalizeName === 'function') 
                            ? window.Utils.normalizeName(suppName) 
                            : suppName.trim().toLowerCase();
                        
                        let s = suppId ? suppliersDB.find(x => x && String(x.id) === String(suppId)) : null;
                        if (!s) {
                            s = suppliersDB.find(x => {
                                if (!x) return false;
                                let xNorm = (window.Utils && typeof window.Utils.normalizeName === 'function')
                                    ? window.Utils.normalizeName(x.name || '')
                                    : String(x.name || '').trim().toLowerCase();
                                return xNorm === normalizedSuppName;
                            });
                        }
                        
                        if (s) {
                            suppId = s.id;
                            suppName = s.name;
                            prevBal = parseFloat(s.calculatedBalance ?? s.balance ?? 0);
                            currBal = parseFloat((prevBal + remaining).toFixed(2));
                            // يمنع نهائياً إضافة أو تعديل أي سندات أو أرصدة يدوياً؛ المركز يتولى الحساب تلقائياً
                        } else { 
                            suppId = nowTs.toString();
                            suppliersDB.push({ 
                                id: suppId, 
                                name: suppName, 
                                phone: "", 
                                balance: 0,
                                _lastModified: nowTs,
                                _lastModifiedBy: dName
                            }); 
                            prevBal = 0;
                            currBal = remaining;
                            if (typeof DB !== 'undefined') DB.saveSuppliers(suppliersDB);
                        }
                    }

                    // القاعدة 1: تحديث أو إنشاء دفعة داخل p.lots وإعادة حساب p.stock وتحديث p._lastModified
                    formattedItems.forEach(item => {
                        let p = productsDB.find(x => String(x.id) === String(item.id));
                        if (p) {
                            p.isDeleted = false;
                            p.isArchived = false;
                            
                            if (!Array.isArray(p.lots)) p.lots = [];
                            p.lots.forEach(lot => {
                                lot.price = item.price;
                                lot._lastModifiedBy = dName;
                            });
                            
                            p.price = item.price;
                            p.purchasePrice = item.purchasePrice;

                            p.lots.unshift({ 
                                supplier: `فاتورة شراء رقم ${newInvoiceId} - المورد: ${suppName || "نقدي"}`, 
                                stock: item.qty, 
                                purchasePrice: item.purchasePrice, 
                                price: item.price, 
                                date: invDate,
                                invoiceId: newInvoiceId,
                                _device: dName,
                                _lastModifiedBy: dName
                            });
                            p.stock = p.lots.reduce((sum, l) => sum + (parseFloat(l.stock) || 0), 0);
                            p._lastModified = Date.now();
                            p._lastModifiedBy = dName;
                        }
                    });
                    if (typeof DB !== 'undefined') DB.saveProducts(productsDB);

                    // القاعدة 4: تسجيل المبالغ المدفوعة عبر DB.recordTreasuryTransaction بنوع purchase
                    if (inputPaid > 0 && typeof DB !== 'undefined' && typeof DB.recordTreasuryTransaction === 'function') {
                        DB.recordTreasuryTransaction({
                            id: nowTs + Math.floor(Math.random() * 1000),
                            type: 'purchase',
                            vault: vaultKey,
                            amountDeduct: inputPaid,
                            date: invDate,
                            timestamp: nowTs,
                            notes: `فاتورة شراء رقم ${newInvoiceId} - المورد: ${suppName || 'نقدي'}`,
                            supplierId: suppId || null,
                            supplier: suppName || null,
                            invoiceNo: newInvoiceId,
                            _device: dName,
                            _lastModified: nowTs
                        });
                    }

                    // القاعدة 3: حفظ الفاتورة حصرياً بـ DB.savePurchaseInvoices
                    let newInvoice = { 
                        id: newInvoiceId, 
                        timestamp: nowTs, 
                        date: invDate, 
                        supplier: suppName || null, 
                        supplierId: suppId || null, 
                        total: finalReq,
                        remaining: remaining,
                        paid: inputPaid, 
                        discount: discount,
                        notes: notes,
                        vault: vaultKey,
                        items: formattedItems,
                        prevBalance: prevBal,
                        currentBalance: currBal,
                        _device: dName,
                        _lastModified: nowTs,
                        _lastModifiedBy: dName 
                    };
                    
                    purchaseInvoicesDB.push(newInvoice);
                    if (typeof DB !== 'undefined') DB.savePurchaseInvoices(purchaseInvoicesDB);

                    lastSavedInvoice = newInvoice;
                } catch (err) {
                    console.error("خطأ أثناء حفظ فاتورة الشراء:", err);
                    SerajAlert("حدث خطأ أثناء الحفظ: " + err.message, "error");
                } finally {
                    _isConfirmingPurchaseSave = false;
                }
            }, 15);
        }

        function buildInvoicePrintHTML(inv) {
            let sub = 0; let itemsHtml = '';
            inv.items.forEach(item => {
                sub += item.total;
                itemsHtml += `<tr><td>${item.name}</td><td>${item.purchasePrice}</td><td>${item.qty}</td><td>${item.total.toFixed(2)}</td></tr>`;
            });

            let totalsHtml = '';
            if (inv.supplier) {
                let prev = inv.prevBalance || 0;
                let curr = inv.currentBalance || 0;
                
                let prevText = prev > 0 ? `${prev.toFixed(2)} (له)` : (prev < 0 ? `${Math.abs(prev).toFixed(2)} (علينا)` : "0.00");
                let currText = curr > 0 ? `${curr.toFixed(2)} (له)` : (curr < 0 ? `${Math.abs(curr).toFixed(2)} (علينا)` : "0.00");

                totalsHtml = `
                    <div><span class="label">إجمالي الفاتورة:</span> ${sub.toFixed(2)}</div>
                    <div><span class="label">المدفوع:</span> ${parseFloat(inv.paid).toFixed(2)}</div>
                    <div><span class="label">باقي الفاتورة:</span> ${parseFloat(inv.remaining).toFixed(2)}</div>
                    <hr>
                    <div><span class="label">حساب سابق:</span> ${prevText}</div>
                    <div><span class="label">إجمالي الحساب الجديد:</span> ${currText}</div>
                `;
            } else {
                totalsHtml = `<div><span class="label">إجمالي الفاتورة:</span> ${sub.toFixed(2)}</div>`;
            }

            return `
                <div class="print-header">سراج LED</div>
                <div class="print-meta-row">
                    <span>رقم: ${inv.id}</span>
                    <span>التاريخ: ${inv.date}</span>
                </div>
                <div class="print-supplier">المورد: ${inv.supplier || "نقدي"}</div>
                
                <table class="print-table">
                    <thead><tr><th>الصنف</th><th>السعر</th><th>العدد</th><th>الإجمالي</th></tr></thead>
                    <tbody>${itemsHtml}</tbody>
                </table>
                
                <div class="print-totals">
                    ${totalsHtml}
                </div>
            `;
        }

        function printLastInvoice() {
            if(!lastSavedInvoice) return;
            document.getElementById('printReceiptArea').innerHTML = buildInvoicePrintHTML(lastSavedInvoice);
            document.body.classList.add('thermal-print-mode');
            
            document.getElementById('printDropdownMenu').style.display = 'none';
            document.getElementById('bottomPrintBar').style.display = 'none';
            
            setTimeout(() => {
                window.print();
                setTimeout(() => { document.body.classList.remove('thermal-print-mode'); }, 500);
            }, 250);
        }

        function exportLastInvoiceToPDF() {
            if(!lastSavedInvoice) return;
            const printArea = document.getElementById('printReceiptArea');
            printArea.innerHTML = buildInvoicePrintHTML(lastSavedInvoice);
            document.getElementById('printDropdownMenu').style.display = 'none';
            document.getElementById('bottomPrintBar').style.display = 'none';

            if (window.Utils && typeof window.Utils.downloadRealPDF === 'function') {
                window.Utils.downloadRealPDF(printArea, `Purchase_Invoice_${lastSavedInvoice.id}.pdf`);
            } else {
                printLastInvoice();
            }
        }

        function exportLastInvoiceToExcel() {
            if(!lastSavedInvoice) return;
            let excelData = [
                ["رقم الفاتورة", lastSavedInvoice.id, "التاريخ", lastSavedInvoice.date],
                ["المورد", lastSavedInvoice.supplier || "نقدي"],
                ["ملاحظات", lastSavedInvoice.notes || ""],
                [],
                ["اسم الصنف", "سعر الشراء", "سعر البيع المسجل", "الكمية", "الإجمالي"]
            ];
            let sub = 0;
            lastSavedInvoice.items.forEach(item => {
                excelData.push([item.name, item.purchasePrice, item.price, item.qty, item.total]);
                sub += item.total;
            });
            excelData.push([]);
            excelData.push(["الإجمالي", sub]);
            excelData.push(["المدفوع", lastSavedInvoice.paid]);
            excelData.push(["المتبقي", lastSavedInvoice.remaining]);

            let ws = XLSX.utils.aoa_to_sheet(excelData);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "فاتورة الشراء");
            XLSX.writeFile(wb, `Purchase_Invoice_${lastSavedInvoice.id}.xlsx`);
            document.getElementById('bottomPrintBar').style.display = 'none';
            lastSavedInvoice = null;
        }

        let html5QrCode = null;
        let currentBarcodeTargetId = '';
        let isDirectSearch = false;

        function startBarcodeScan(targetInputId, directSearch = false) {
            currentBarcodeTargetId = targetInputId;
            isDirectSearch = directSearch;
            
            history.pushState({ modalOpen: true }, ''); 
            
            document.getElementById('scannerModal').style.display = 'flex';
            
            setTimeout(() => {
                if (html5QrCode) {
                    html5QrCode.stop().then(() => { html5QrCode.clear(); startCamera(); }).catch(e => { startCamera(); });
                } else {
                    html5QrCode = new Html5Qrcode("reader");
                    startCamera();
                }
            }, 100);
        }

        function startCamera() {
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText, decodedResult) => {
                    let beep = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'); 
                    beep.play().catch(e => {});

                    stopBarcodeScan();

                    document.getElementById(currentBarcodeTargetId).value = decodedText;

                    if (isDirectSearch) {
                        loadDB();
                        let p = productsDB.find(x => String(x.barcode) === decodedText || String(x.id) === decodedText);
                        if (p) {
                            let existsIndex = invoice.findIndex(invItem => String(invItem.id) === String(p.id));
                            if(existsIndex > -1) {
                                SerajAlert("الصنف موجود مسبقاً في الفاتورة!");
                                document.getElementById('productSearch').value = '';
                            } else {
                                openEditModalForNewItem(p.id); 
                                document.getElementById('productSearch').value = ''; 
                            }
                        } else {
                            SerajAlert("الصنف غير موجود في المخزن! يمكنك إضافته عبر زر + السريع.");
                        }
                    }
                },
                (errorMessage) => { }
            ).catch((err) => {
                SerajAlert("يرجى التأكد من إعطاء صلاحية الكاميرا للمتصفح.");
                document.getElementById('scannerModal').style.display = 'none';
            });
        }

        function stopBarcodeScan() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => { html5QrCode.clear(); html5QrCode = null; document.getElementById('scannerModal').style.display = 'none'; }).catch(err => { document.getElementById('scannerModal').style.display = 'none'; });
            } else {
                document.getElementById('scannerModal').style.display = 'none';
            }
        }
    </script>

    <!-- ================= عقل المايك وطابور المشتريات (SmartVoice Lite V4) ================= -->
    <script>
        let searchQueue = [];
        let currentQueueQty = 1;

        function updateQueueUI() {
            const qContainer = document.getElementById('queueContainer');
            const qText = document.getElementById('queueStatusText');
            const searchInput = document.getElementById('productSearch');

            if (searchQueue.length > 0) {
                qContainer.style.display = 'flex';
                let currentItem = searchQueue[0];
                qText.innerHTML = `(${searchQueue.length}) متبقي -- العدد ${currentItem.qty} من: ${currentItem.name}`;
                currentQueueQty = currentItem.qty;
                
                searchInput.value = currentItem.name;
                smartSearch(); 
            } else {
                qContainer.style.display = 'none';
                searchInput.value = '';
                currentQueueQty = 1;
                document.getElementById('productResults').style.display = 'none';
            }
        }

        function processNextInQueue() {
            if (searchQueue.length > 0) { 
                searchQueue.shift(); 
                updateQueueUI(); 
            }
        }

        let aiMicRecognition = null;
        let isAiMicRecording = false;

        function openAiModal() {
            history.pushState({ modalOpen: true }, '');
            document.getElementById('aiModalOverlay').style.display = 'flex';
            document.getElementById('aiInputText').value = '';
        }

        function closeAiModal() {
            document.getElementById('aiModalOverlay').style.display = 'none';
        }

        function startAiMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return SerajAlert("المتصفح لا يدعم التسجيل الصوتي.");
            
            let btn = document.getElementById('aiMicBtn');
            let micIcon = document.getElementById('aiAssistantBtn');
            if (aiMicRecognition && isAiMicRecording) {
                aiMicRecognition.stop();
                return;
            }
            
            aiMicRecognition = new SpeechRecognition();
            aiMicRecognition.lang = 'ar-EG';
            aiMicRecognition.continuous = true;
            aiMicRecognition.interimResults = false;

            aiMicRecognition.onstart = () => {
                isAiMicRecording = true;
                btn.classList.add('recording');
                btn.innerText = '🔴 جاري الاستماع...';
                if(micIcon) micIcon.classList.add('recording');
            };
            aiMicRecognition.onresult = (e) => {
                let text = "";
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) text += e.results[i][0].transcript + " ";
                }
                if(text) document.getElementById('aiInputText').value += text;
            };
            aiMicRecognition.onend = () => {
                isAiMicRecording = false;
                btn.classList.remove('recording');
                btn.innerText = '🎤 اضغط هنا وتحدث';
                if(micIcon) micIcon.classList.remove('recording');
            };
            try { aiMicRecognition.start(); } catch(e) { console.error("خطأ:", e); }
        }

        // القاعدة 2: المايك الخفيف (SmartVoice Lite) بدون أي فلاتر محلية
        function processLocalAI() {
            let rawText = document.getElementById('aiInputText').value.trim();
            if (!rawText) return SerajAlert("الرجاء التحدث أو كتابة الطلبات أولاً!");

            let loading = document.getElementById('aiLoadingIndicator');
            let sendBtn = document.getElementById('sendAiBtn');
            if (loading) {
                loading.hidden = false;
                loading.style.display = 'block';
            }
            if (sendBtn) sendBtn.disabled = true;

            setTimeout(() => {
                try {
                    let safeProducts = (typeof productsDB !== 'undefined' && productsDB.length > 0) ? productsDB : ((typeof DB !== 'undefined' && DB.getProducts) ? DB.getProducts(true) : []);
                    let engine = window.SmartVoice || (typeof SmartVoice !== 'undefined' ? SmartVoice : null);
                    
                    if (!engine || typeof engine.analyzeFullText !== 'function') {
                        throw new Error("المحرك الصوتي غير متصل بشكل سليم بالصفحة.");
                    }
                    
                    let result = engine.analyzeFullText(rawText, safeProducts, 'purchases');

                    if (result && Array.isArray(result.queue) && result.queue.length > 0) {
                        searchQueue = result.queue;
                    } else {
                        SerajAlert("لم يتم العثور على أصناف مطابقة للمخزن في هذه الجملة.");
                    }

                    if (loading) {
                        loading.hidden = true;
                        loading.style.display = 'none';
                    }
                    if (sendBtn) sendBtn.disabled = false;
                    closeAiModal();

                    if (typeof updateQueueUI === 'function') {
                        updateQueueUI();
                    }
                } catch (error) {
                    if (loading) {
                        loading.hidden = true;
                        loading.style.display = 'none';
                    }
                    if (sendBtn) sendBtn.disabled = false;
                    console.error("Purchases Voice Error:", error);
                    SerajAlert("حدث خطأ أثناء معالجة البيانات: " + error.message, "error");
                }
            }, 100);
        }
    </script>
